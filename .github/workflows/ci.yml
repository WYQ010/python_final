# CI：只跑契约测试（合成数据，不依赖 data/）——《统一接口定义》§7 测试分层
# 3.14 为目标版本但标记 best-effort（continue-on-error，不阻塞 PR）；
# 3.13 为兜底必过门禁；本地 pytest 全绿仍是最终门禁。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-tests-314:
    name: 契约测试（Python 3.14，best-effort）
    runs-on: ubuntu-latest
    continue-on-error: true   # runner 若暂不支持 3.14：失败不阻塞（见《统一接口定义》§7）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt pytest
      - name: 契约测试
        run: |
          if [ -d tests ]; then
            set +e
            python -m pytest tests -q
            code=$?
            set -e
            if [ "$code" -eq 5 ]; then
              echo "tests/ 暂无用例（pytest exit 5），视为通过"
            elif [ "$code" -ne 0 ]; then
              exit "$code"
            fi
          else
            echo "tests/ 尚不存在（M1 交付），本次跳过"
          fi

  contract-tests-fallback:
    name: 契约测试（Python 3.13 兜底，必过）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt pytest
      - name: 契约测试
        run: |
          if [ -d tests ]; then
            set +e
            python -m pytest tests -q
            code=$?
            set -e
            if [ "$code" -eq 5 ]; then
              echo "tests/ 暂无用例（pytest exit 5），视为通过"
            elif [ "$code" -ne 0 ]; then
              exit "$code"
            fi
          else
            echo "tests/ 尚不存在（M1 交付），本次跳过"
          fi
